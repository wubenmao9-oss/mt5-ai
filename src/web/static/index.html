<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="/static/benmao.jpg" type="image/jpeg">
<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{font-family:'Inter',system-ui,sans-serif}
.tab-active{border-bottom:2px solid #10b981;color:#e5e7eb}
.tab-inactive{border-bottom:2px solid transparent;color:#6b7280}
.tab-inactive:hover{color:#9ca3af}
#toast-box{position:fixed;top:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:0.5rem;pointer-events:none}
#toast-box>div{pointer-events:auto;border-radius:0.75rem;padding:0.75rem 1rem;min-width:280px;max-width:420px;backdrop-filter:blur(12px);box-shadow:0 8px 32px rgba(0,0,0,0.4);animation:toastIn .3s ease-out;display:flex;align-items:flex-start;gap:0.5rem;font-size:0.875rem;line-height:1.4}
#toast-box>div.out{animation:toastOut .25s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}
.toast-success{background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);color:#6ee7b7}
.toast-error{background:rgba(244,63,94,0.15);border:1px solid rgba(244,63,94,0.3);color:#fda4af}
.toast-warn{background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.3);color:#fde68a}
.toast-info{background:rgba(107,114,128,0.2);border:1px solid rgba(107,114,128,0.3);color:#d1d5db}
#confirm-overlay{position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#confirm-box{background:#1f2937;border:1px solid #374151;border-radius:1rem;padding:1.5rem;max-width:400px;width:90%;box-shadow:0 16px 48px rgba(0,0,0,0.5)}
</style>
</head>
<body class="bg-gray-950 text-gray-300 min-h-screen">
<div id="app"></div><div id="toast-box"></div>
<script>/* toast system check */window.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>{if(typeof toast==='function')toast('MT5-Ai Dashboard ready','success');else console.error('toast not defined')},500)});</script>
<script>
const API="";const TARGET=10.0;let currentTab="positions";let lang=localStorage.getItem("lang")||"en";let _layoutReady=false;
let _authed=false,_authVip=0,_authKmtype="",_authKtype="",_authNote="";
let _curSymbol="XAUUSD";

const T={"MT5-Ai Smart Engine":{zh:"笨猫MT5智能策略交易"},"v2.0 B2 Strategy":{zh:"v2.0 B2 策略"},Killswitch:{zh:"紧急停止"},Positions:{zh:"持仓"},"Trade Log":{zh:"交易日志"},History:{zh:"历史记录"},Decisions:{zh:"决策记录"},Config:{zh:"参数设置"},Chart:{zh:"K线图表"},Audit:{zh:"交易审计"},"No active positions":{zh:"暂无活跃持仓"},"Waiting for signals...":{zh:"等待信号中..."},"Symbol / Dir":{zh:"品种 / 方向"},Vol:{zh:"手数"},"Open -> Current":{zh:"开仓 -> 现价"},"SL / Status":{zh:"止损 / 状态"},PnL:{zh:"盈亏"},Duration:{zh:"持仓时间"},"Break-even":{zh:"保本"},Locked:{zh:"锁定盈利"},Initial:{zh:"初始"},"No trade records":{zh:"暂无交易记录"},Time:{zh:"时间"},Direction:{zh:"方向"},Strategy:{zh:"策略"},Price:{zh:"价格"},Reason:{zh:"原因"},"No closed trade records":{zh:"暂无已平仓记录"},"Open Time":{zh:"开仓时间"},Dir:{zh:"方向"},Open:{zh:"开仓价"},Close:{zh:"平仓价"},"No decision records":{zh:"暂无决策记录"},"Active Positions":{zh:"活跃持仓"},"Closed Trades":{zh:"已平仓交易"},Account:{zh:"账户"},Equity:{zh:"净值"},Balance:{zh:"余额"},"Free Margin":{zh:"可用保证金"},"Daily Progress":{zh:"每日进度"},"Realized PnL":{zh:"已实现盈亏"},Target:{zh:"目标"},Trades:{zh:"交易次数"},Drawdown:{zh:"回撤"},"H1 Macro":{zh:"H1 宏观"},Bullish:{zh:"看多"},Bearish:{zh:"看空"},Neutral:{zh:"中性"},Mode:{zh:"模式"},Silence:{zh:"静默原因"},"Win Rate":{zh:"胜率"},"Total PnL":{zh:"总盈亏"},Running:{zh:"运行中"},Sleeping:{zh:"休眠中"},Killed:{zh:"已停止"},Error:{zh:"错误"},Init:{zh:"初始化"},Unknown:{zh:"未知"},"Connection Error":{zh:"连接错误"},"Cannot reach API server. Make sure run.py is started.":{zh:"无法连接 API 服务器，请确认 run.py 已启动。"},"Kill all positions and cancel all orders?":{zh:"确认平掉所有持仓并取消所有挂单？"},positions:{zh:"个持仓"},orders:{zh:"个挂单"},"Killswitch failed - check server":{zh:"紧急停止失败 - 请检查服务器"},"Risk Parameters":{zh:"风控参数"},"Strategy Parameters":{zh:"策略参数"},"Session Parameters":{zh:"交易时段"},"Apply Changes":{zh:"应用修改"},"Confirm Config Changes":{zh:"确认参数修改"},"Are you sure?":{zh:"确认应用这些修改吗？"},"Changes pending... Engine will apply on next cycle.":{zh:"修改已提交，引擎将在下个周期应用。"},"Config update failed":{zh:"参数更新失败"},"No changes":{zh:"无变更"},"Loading config...":{zh:"加载参数中..."},"Equity Curve":{zh:"净值曲线"},"Daily Stats":{zh:"每日统计"},"Reason Distribution":{zh:"原因分布"},"Recent Trades":{zh:"近期交易"},Indicators:{zh:"指标"},"Profit Factor":{zh:"盈亏比"},"Avg Win":{zh:"平均盈利"},"Avg Loss":{zh:"平均亏损"},Day:{zh:"日期"},Count:{zh:"次数"},"No audit data":{zh:"暂无审计数据"},"Date Filter":{zh:"日期筛选"},"From":{zh:"从"},"To":{zh:"至"},"Apply":{zh:"应用"},"Daily PnL Detail":{zh:"每日盈亏详情"},"Date":{zh:"日期"},"Switch Strategy":{zh:"切换策略"},"Current":{zh:"当前"},"Switch to":{zh:"切换至"},"Confirm switch?":{zh:"确认切换？"},"Strategy switch pending...":{zh:"策略切换已提交..."},"Strategy switch failed":{zh:"策略切换失败"},"Test Connection":{zh:"测试连接"},"Testing...":{zh:"测试中..."},"MT5 Connected":{zh:"MT5 已连接"},"MT5 Disconnected":{zh:"MT5 未连接"},"Symbol valid":{zh:"品种有效"},"Symbol invalid":{zh:"品种无效"},Settings:{zh:"系统设置"},"MT5 Account":{zh:"MT5 账户"},"Email Alerts":{zh:"邮件报警"},"Save & Restart":{zh:"保存并重启"},"Saving...":{zh:"保存中..."},"Config saved. Restarting...":{zh:"配置已保存，正在重启..."},"Restart failed":{zh:"重启失败"},"Confirm restart?":{zh:"确认重启？"},"This will restart the entire application.":{zh:"这将重启整个应用程序。"},"Enter Card Key":{zh:"请输入卡密"},"Verify & Login":{zh:"验证登录"},"Verifying...":{zh:"验证中..."},"Card Auth":{zh:"卡密验证"},"License":{zh:"授权信息"},"Remaining":{zh:"剩余时间"},"Permanent":{zh:"永久"},"Expired":{zh:"已到期"},"Logout":{zh:"退出登录"},"Session expired, please re-login":{zh:"会话已过期，请重新登录"},Cancel:{zh:"取消"},Confirm:{zh:"确认"},"Buy Card Key":{zh:"购买卡密"},Close:{zh:"平仓"},"Close All Profitable":{zh:"一键平盈利仓"},Action:{zh:"操作"},"Test Email":{zh:"测试邮件"}};
function t(k){if(lang==="zh"&&T[k]&&T[k].zh)return T[k].zh;return k}

// ==================== Toast & Confirm ====================
const _icons={success:'<svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>',error:'<svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>',warn:'<svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86l-8.14 14.1A1 1 0 002.93 19.5h18.14a1 1 0 00.87-1.54l-8.14-14.1a1 1 0 00-1.72 0z"/></svg>',info:'<svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M12 2a10 10 0 100 20 10 10 0 000-20z"/></svg>'};
function toast(msg,type='info',ms=3500){
  const box=document.getElementById('toast-box');if(!box)return;
  const d=document.createElement('div');d.className='toast-'+type;
  d.innerHTML=(_icons[type]||_icons.info)+'<span>'+msg+'</span>';
  box.appendChild(d);
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),300)},ms);
}
function customConfirm(title,msg){
  return new Promise(resolve=>{
    const ov=document.createElement('div');ov.id='confirm-overlay';
    ov.innerHTML=`<div id="confirm-box"><div class="text-base font-semibold text-gray-100 mb-2">${title}</div><div class="text-sm text-gray-400 mb-5 whitespace-pre-line">${msg}</div><div class="flex justify-end gap-3"><button id="cf-cancel" class="px-4 py-2 rounded-lg text-sm font-medium bg-gray-700 hover:bg-gray-600 text-gray-300 transition border border-gray-600">${t("Cancel")||"Cancel"}</button><button id="cf-ok" class="px-4 py-2 rounded-lg text-sm font-medium bg-emerald-600 hover:bg-emerald-500 text-white transition">${t("Confirm")||"Confirm"}</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector('#cf-cancel').onclick=()=>{ov.remove();resolve(false)};
    ov.querySelector('#cf-ok').onclick=()=>{ov.remove();resolve(true)};
    ov.addEventListener('keydown',e=>{if(e.key==='Escape'){ov.remove();resolve(false)}});
    ov.querySelector('#cf-ok').focus();
  });
}

async function get(p){try{const r=await fetch(API+p);if(r.status===401&&!p.startsWith("/api/auth/")){_authed=false;renderLoginGate();return null}if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();return j.data||j}catch(e){console.error("API:",p,e);return null}}
async function post(p,body){try{const o={method:"POST",headers:{"Content-Type":"application/json"}};if(body)o.body=JSON.stringify(body);const r=await fetch(API+p,o);if(r.status===401&&!p.startsWith("/api/auth/")){_authed=false;renderLoginGate();return null}if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}catch(e){console.error("API:",p,e);return null}}
function fmt(v){return(v??0).toFixed(2)}
function pnlC(v){return v>0?"text-emerald-400":v<0?"text-rose-400":"text-gray-400"}
function iso2u(s){return Math.floor(new Date(s).getTime()/1000)}
function stLbl(s){const m={RUNNING:`bg-emerald-500 ${t("Running")}`,SLEEP:`bg-amber-500 ${t("Sleeping")}`,KILLED:`bg-rose-500 ${t("Killed")}`,ERROR:`bg-red-600 ${t("Error")}`,INIT:`bg-blue-500 ${t("Init")}`};return m[s]||`bg-gray-500 ${t("Unknown")}`}
function today(){return new Date().toISOString().slice(0,10)}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)}

// ==================== Layout (rendered once) ====================
function renderLayout(){
  document.getElementById("app").innerHTML=`
  <div class="max-w-7xl mx-auto p-6">
    <div id="header"></div>
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <div class="lg:col-span-3 space-y-6" id="sidebar"></div>
      <div class="lg:col-span-9">
        <div class="bg-gray-900 rounded-xl border border-gray-800 h-full flex flex-col">
          <div id="main-title" class="px-6 py-5 border-b border-gray-800 flex justify-between items-center"></div>
          <div id="tab-bar"></div>
          <div class="overflow-x-auto flex-1" id="mc"></div>
        </div>
      </div>
    </div>
  </div>`;
  _layoutReady=true;
}

// ==================== Header ====================
function renderHeader(st){
  const el=document.getElementById("header");if(!el)return;
  const sl=stLbl(st.engine_state);
  const curS=st.active_strategy||"B2";
  const stratLabel=lang==="zh"?`v2.0 <span class="text-emerald-400 font-semibold">${curS}</span> 策略`:`v2.0 <span class="text-emerald-400 font-semibold">${curS}</span> Strategy`;
  el.innerHTML=`<div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-800"><div class="flex items-center gap-4"><img src="/static/benmao.jpg" class="w-10 h-10 rounded-xl object-cover shadow-lg"><div><h1 class="text-xl font-bold text-gray-100 tracking-wide">${t("MT5-Ai Smart Engine")}</h1><div class="text-xs text-gray-500 mt-0.5">${stratLabel}</div></div><div class="h-8 w-px bg-gray-800 mx-2"></div><div class="flex items-center gap-2 bg-gray-800/50 px-3 py-1.5 rounded-full border border-gray-700"><span class="w-2.5 h-2.5 rounded-full ${sl.split(" ")[0]} animate-pulse"></span><span class="text-sm font-medium">${sl.split(" ").slice(1).join(" ")}</span></div></div><div class="flex items-center gap-3"><button onclick="toggleLang()" class="flex items-center gap-1.5 bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg text-sm font-medium transition border border-gray-700"><svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>${lang==="en"?"中文":"EN"}</button><button onclick="killswitch()" class="flex items-center gap-2 bg-rose-600 hover:bg-rose-500 px-4 py-2 rounded-lg font-medium transition shadow-lg shadow-rose-900/20">${t("Killswitch")}</button></div></div>`;
}

// ==================== Sidebar ====================
function renderSidebar(st){
  const el=document.getElementById("sidebar");if(!el)return;
  const acc=st.account||{},s=st.stats||{},ei=st.engine_info||{},dp=st.daily_pnl||0;
  const ml=st.macro_bias==="BULLISH"?t("Bullish"):st.macro_bias==="BEARISH"?t("Bearish"):t("Neutral");
  const mc=st.macro_bias==="BULLISH"?"text-emerald-400 bg-emerald-400/10":st.macro_bias==="BEARISH"?"text-rose-400 bg-rose-400/10":"text-gray-400 bg-gray-800";
  const curStrat=st.active_strategy||"B2";
  const kmLabel=KM_LABEL[_authKmtype]||_authKmtype||"-";
  const kmBadge=_authKmtype==="longuse"?"bg-emerald-500/20 text-emerald-400 border-emerald-800/50":_authVip>0&&_authVip<=Math.floor(Date.now()/1000)?"bg-rose-500/20 text-rose-400 border-rose-800/50":"bg-amber-500/20 text-amber-400 border-amber-800/50";
  // Bidirectional progress bar: center=0, left=loss(red), right=profit(green), max ±100
  const dpClamped=Math.max(-100,Math.min(100,dp));
  const barPct=Math.min(50,Math.abs(dpClamped)/100*50);
  const isProfit=dp>=0;
  const dpLabel=Math.abs(dp)>=99?(isProfit?"99+":"99-"):Math.abs(dp).toFixed(2);
  const barHtml=dp===0?`<div class="h-3 w-full bg-gray-800 rounded-full relative shadow-inner"><div class="absolute left-1/2 top-0 w-0.5 h-full bg-gray-600"></div></div>`
    :isProfit?`<div class="h-3 w-full bg-gray-800 rounded-full relative shadow-inner overflow-hidden"><div class="absolute left-1/2 top-0 w-0.5 h-full bg-gray-600 z-10"></div><div class="absolute top-0 h-full bg-gradient-to-r from-emerald-500 to-emerald-300 rounded-r-full transition-all duration-700" style="left:50%;width:${barPct}%"></div></div>`
    :`<div class="h-3 w-full bg-gray-800 rounded-full relative shadow-inner overflow-hidden"><div class="absolute left-1/2 top-0 w-0.5 h-full bg-gray-600 z-10"></div><div class="absolute top-0 h-full bg-gradient-to-l from-rose-500 to-rose-300 rounded-l-full transition-all duration-700" style="right:50%;width:${barPct}%"></div></div>`;
  el.innerHTML=`<div class="bg-gray-900 rounded-xl border border-gray-800 p-5"><h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">${t("Account")}</h2><div class="space-y-4"><div><div class="text-xs text-gray-500 mb-1">${t("Equity")}</div><div class="text-3xl font-bold text-gray-100">${fmt(acc.equity)}</div></div><div class="grid grid-cols-2 gap-4 pt-4 border-t border-gray-800/50"><div><div class="text-xs text-gray-500 mb-1">${t("Balance")}</div><div class="text-lg font-mono text-gray-300">${fmt(acc.balance)}</div></div><div><div class="text-xs text-gray-500 mb-1">${t("Free Margin")}</div><div class="text-lg font-mono text-gray-300">${fmt(acc.margin_free)}</div></div></div><button onclick="testMT5()" id="mt5-test-btn" class="mt-4 w-full flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 px-3 py-2 rounded-lg text-sm font-medium transition"><svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>${t("Test Connection")}</button></div></div><div class="bg-gray-900 rounded-xl border border-gray-800 p-5 relative overflow-hidden"><h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">${t("Daily Progress")}</h2><div class="flex justify-between items-end mb-2"><div><div class="text-xs text-gray-500 mb-1">${t("Realized PnL")}</div><div class="text-2xl font-bold ${pnlC(dp)}">${dp>0?"+":""}${dpLabel} USD</div></div><div class="text-right"><div class="text-xs text-gray-500 mb-1">-100</div><div class="text-xs text-gray-600">±100 USD</div></div></div>${barHtml}<div class="flex justify-between text-xs mt-1"><span class="text-rose-400/60">-100</span><span class="text-gray-600">0</span><span class="text-emerald-400/60">+100</span></div><div class="mt-3 flex justify-between text-xs"><span class="text-gray-500">${t("Trades")}: <span class="text-gray-300">${st.daily_trades||0}</span></span><span class="text-gray-500">${t("Drawdown")}: <span class="text-rose-400">${fmt(st.daily_max_drawdown)}</span></span></div><button onclick="showDailyPnl()" class="mt-3 w-full text-xs text-emerald-400 hover:text-emerald-300 transition text-left">${t("Daily PnL Detail")} ▸</button></div><div class="bg-gray-900 rounded-xl border border-gray-800 p-5"><h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">${t("Strategy")}</h2><div class="space-y-4"><div class="flex justify-between items-center"><span class="text-sm text-gray-400">${t("H1 Macro")}</span><span class="${mc} px-2 py-1 rounded text-sm">${ml}</span></div><div class="flex justify-between items-center pt-3 border-t border-gray-800/50"><span class="text-sm text-gray-400">${t("Mode")}</span><span class="text-sm font-medium text-amber-200 bg-amber-900/30 px-2 py-1 rounded border border-amber-800/50">${ei.state||"INIT"}</span></div><div class="flex justify-between items-center pt-3 border-t border-gray-800/50"><span class="text-sm text-gray-400">${t("Strategy")}</span><span class="text-sm font-mono text-emerald-400">${curStrat}</span></div><div class="flex justify-between items-center pt-3 border-t border-gray-800/50"><span class="text-sm text-gray-400">${t("Silence")}</span><span class="text-xs text-gray-500">${ei.silence_reason||"-"}</span></div><div class="flex justify-between items-center pt-3 border-t border-gray-800/50"><span class="text-sm text-gray-400">${t("Win Rate")}</span><span class="text-sm font-mono text-gray-300">${(s.win_rate||0).toFixed(1)}% (${s.wins||0}/${s.total_trades||0})</span></div><div class="flex justify-between items-center pt-3 border-t border-gray-800/50"><span class="text-sm text-gray-400">${t("Total PnL")}</span><span class="text-sm font-mono ${pnlC(s.total_pnl||0)}">${(s.total_pnl||0)>0?"+":""}${fmt(s.total_pnl||0)}</span></div></div></div><div class="bg-gray-900 rounded-xl border border-gray-800 p-5"><h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">${t("License")}</h2><div class="flex items-center justify-between mb-2"><span class="text-xs text-gray-500">${t("Card Auth")}</span><span class="text-xs font-medium px-2 py-0.5 rounded border ${kmBadge}">${kmLabel}</span></div><div class="flex items-center justify-between"><span id="cd-label" class="text-xs text-gray-500">${t("Remaining")}</span><span id="cd-time" class="text-sm font-mono font-bold text-emerald-400">${formatCountdown(_authVip)}</span></div>${_authNote?`<div class="text-xs text-gray-600 mt-2 truncate" title="${_authNote}">${_authNote}</div>`:""}<button onclick="doLogout()" class="mt-3 w-full text-xs text-gray-500 hover:text-rose-400 transition text-left">${t("Logout")} ▸</button></div>`;
}

// ==================== Tab Bar ====================
function renderTabs(){
  const el=document.getElementById("tab-bar");if(!el)return;
  const tabs=["positions","trades","history","decisions","chart","config","audit","settings"];
  const lb={positions:t("Positions"),trades:t("Trade Log"),history:t("History"),decisions:t("Decisions"),chart:t("Chart"),config:t("Config"),audit:t("Audit"),settings:t("Settings")};
  el.innerHTML=`<div class="flex gap-5 border-b border-gray-800 px-6 pt-4 flex-wrap">${tabs.map(tb=>`<button onclick="switchTab('${tb}')" class="pb-3 text-sm font-medium transition ${currentTab===tb?'tab-active':'tab-inactive'}">${lb[tb]}</button>`).join("")}</div>`;
}

function renderTitle(){
  const el=document.getElementById("main-title");if(!el)return;
  const tm={positions:t("Active Positions"),trades:t("Trade Log"),history:t("Closed Trades"),decisions:t("Decisions"),chart:t("Chart"),config:t("Config"),audit:t("Audit"),settings:t("Settings")};
  el.innerHTML=`<h2 class="text-lg font-semibold text-gray-100">${tm[currentTab]||""}</h2><div class="flex items-center text-xs text-gray-500"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-2"></span>LIVE</div>`;

const KM_LABEL={hour:"时卡",day:"天卡",week:"周卡",month:"月卡",season:"季卡",year:"年卡",longuse:"永久卡",single:"次数卡",free:"免费"};

function formatCountdown(vipTs){
  if(vipTs===0||_authKmtype==="longuse")return t("Permanent");
  const rem=vipTs-Math.floor(Date.now()/1000);
  if(rem<=0)return t("Expired");
  const d=Math.floor(rem/86400),h=Math.floor((rem%86400)/3600),m=Math.floor((rem%3600)/60),s=rem%60;
  if(d>0)return d+t("Day")+" "+h+"h "+m+"m";
  if(h>0)return h+"h "+m+"m "+s+"s";
  return m+"m "+s+"s";
}

async function doLogin(){

let _cdInterval=null;
function startCountdown(){
  if(_cdInterval)clearInterval(_cdInterval);
  _cdInterval=setInterval(()=>{
    const el=document.getElementById("cd-time");
    if(!el){clearInterval(_cdInterval);_cdInterval=null;return}
    el.textContent=formatCountdown(_authVip);
    if(_authVip>0&&_authVip<=Math.floor(Date.now()/1000)){
      el.classList.add("text-rose-400");el.classList.remove("text-emerald-400","text-amber-400");
      const lbl=document.getElementById("cd-label");if(lbl)lbl.textContent=t("Expired");
    }else if(_authVip>0){
      const rem=_authVip-Math.floor(Date.now()/1000);
      if(rem<3600){el.classList.add("text-amber-400");el.classList.remove("text-emerald-400","text-rose-400")}
      else{el.classList.add("text-emerald-400");el.classList.remove("text-amber-400","text-rose-400")}
    }
  },1000);
}

async function render(){
  if(!_authed){
    const a=await get("/api/auth/status");

      _authed=true;_authVip=a.vip||0;_authKmtype=a.kmtype||"";_authKtype=a.ktype||"";_authNote=a.note||"";

      renderLoginGate();return;

  }

  const st=await get("/api/status");
  if(!st){document.getElementById("app").innerHTML=`<div class="max-w-7xl mx-auto p-6"><div class="bg-rose-900/30 border border-rose-800 rounded-xl p-6 text-center"><h2 class="text-rose-400 text-lg font-bold mb-2">${t("Connection Error")}</h2><p class="text-rose-300/70 text-sm">${t("Cannot reach API server. Make sure run.py is started.")}</p></div></div>`;_layoutReady=false;setTimeout(render,5000);return}
  if(st.config&&st.config.symbol)_curSymbol=st.config.symbol;

  // Show strategy switch error if any
  if(st.switch_error&&!_switchErrShown){_switchErrShown=true;toast(t("Strategy switch failed")+": "+st.switch_error,'error',8000)}
  if(!st.switch_error)_switchErrShown=false;

  if(!_layoutReady){renderLayout();renderTabs();renderTitle();activateTab();startCountdown()}
  renderHeader(st);renderSidebar(st);

  // Refresh table content only for table tabs
  if(["positions","trades","history","decisions"].includes(currentTab)){await refreshTableContent()}
  // Refresh chart and audit on their tabs
  if(currentTab==="chart"&&CM.chart){CM.load()}
  if(currentTab==="audit"&&AM.eqC){AM.load()}

  // Periodic auth check
  if(_authVip>0&&_authVip<=Math.floor(Date.now()/1000)){
    _authed=false;renderLoginGate();
    toast(t("Session expired, please re-login"),'warn',5000);
    const el=document.getElementById("login-error");if(el){el.textContent=t("Session expired, please re-login");el.classList.remove("hidden")}
    return;
  }

  setTimeout(render,3000);
}

  if(!r){btn.innerHTML=`<svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>${t("MT5 Disconnected")}`;toast(t("MT5 Disconnected"),'error');btn.disabled=false;return}
  if(r.ok){const a=r.account||{};btn.innerHTML=`<svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>${t("MT5 Connected")}`;btn.title=`Login: ${a.login}\nName: ${a.name}\nServer: ${a.server}\nBalance: ${fmt(a.balance)}\nEquity: ${fmt(a.equity)}\nSymbols: ${r.symbols_total}`;toast(t("MT5 Connected")+' - '+a.login+' @ '+a.server,'success')}
  else{btn.innerHTML=`<svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>${t("MT5 Disconnected")}`;btn.title=r.error||"";toast(t("MT5 Disconnected")+': '+(r.error||""),'error')}
  btn.disabled=false;
  setTimeout(()=>{btn.innerHTML=`<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>${t("Test Connection")}`;btn.title=""},8000);
}

render();
</script>
</body>
</html>
